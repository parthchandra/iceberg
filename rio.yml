schemaVersion: 2.0
timeout: 120

notify:
  pullRequestComment:
    postOnSuccess: false

machine:
  env:
    RUNTIME_JDK_VERSION: 11
    skipTest: false
    CODE_VERSION: $(./code_version.sh)

reports:
  checkstyle: true
  pmd: true
  findbugs: true
  junit: true

pipelines:

# prb builds
- name: pr-scala-2.12
  branchName: apple-1.0.x-preview
  build:
    template: buildozer:v4:prb
  machine:
    env:
      scalaVersion: 2.12

- name: pr-scala-2.13
  branchName: apple-1.0.x-preview
  build:
    template: buildozer:v4:prb
  machine:
    env:
      scalaVersion: 2.13

- branchName: apple-1.0.x-preview-release
  build:
    template: buildozer:v4:prb

# publish pipelines
- name: publish-scala-2.12
  branchName: apple-1.0.x-preview
  build:
    template: buildozer:v4:publish
  package:
    libraries:
    - publish:
      - repo: m2:oss-patched
  finally:
    radar:
      annotate: true
  machine:
    env:
      scalaVersion: 2.12

- name: publish-scala-2.13
  branchName: apple-1.0.x-preview
  build:
    template: buildozer:v4:publish
  package:
    libraries:
      - publish:
          - repo: m2:oss-patched
  finally:
    radar:
      annotate: true
  machine:
    env:
      scalaVersion: 2.13

- branchName: apple-1.0.x-preview-release
  build:
    template: buildozer:v4:publish
  package:
    release: true
    libraries:
    - publish:
      - repo: m2:oss-patched
  finally:
    radar:
      annotate: true
    tag:
      expression: ${CODE_VERSION}
