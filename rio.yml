schemaVersion: 2.0
timeout: 150

notify:
  pullRequestComment:
    postOnSuccess: false

machine:
  env:
    RUNTIME_JDK_VERSION: 11
    skipTest: false
    CODE_VERSION: $(./code_version.sh)

reports:
  checkstyle: true
  pmd: true
  findbugs: true
  junit: true

pipelines:

# prb builds
- name: apple-1.0.x-preview-spj-scala-2.12-prb
  branchName: apple-1.0.x-preview-spj
  build:
    template: buildozer:v4:prb

- name: apple-1.0.x-preview-spj-scala-2.13-prb
  branchName: apple-1.0.x-preview-spj
  build:
    template: freestyle:v4:prb
    steps:
      - ./gradlew -DscalaVersion=2.13 :iceberg-spark:iceberg-spark-3.3_2.13:build :iceberg-spark:iceberg-spark-extensions-3.3_2.13:build :iceberg-spark:iceberg-spark-runtime-3.3_2.13:build
  machine:
    baseImage: docker.apple.com/base-images/ubi8/java11-builder

- name: apple-1.0.x-preview-spj-release-scala-2.12-prb
  branchName: apple-1.0.x-preview-spj-release
  build:
    template: buildozer:v4:prb

- name: apple-1.0.x-preview-spj-release-scala-2.13-prb
  branchName: apple-1.0.x-preview-spj-release
  build:
    template: freestyle:v4:prb
    steps:
      - ./gradlew -DscalaVersion=2.13 :iceberg-spark:iceberg-spark-3.3_2.13:build :iceberg-spark:iceberg-spark-extensions-3.3_2.13:build :iceberg-spark:iceberg-spark-runtime-3.3_2.13:build
  machine:
    baseImage: docker.apple.com/base-images/ubi8/java11-builder

# publish pipelines
- name: apple-1.0.x-preview-spj-scala-2.12-snapshot
  branchName: apple-1.0.x-preview-spj
  build:
    template: buildozer:v4:publish
  package:
    libraries:
    - publish:
      - repo: m2:oss-patched
  finally:
    radar:
      annotate: true

- name: apple-1.0.x-preview-spj-scala-2.13-snapshot
  branchName: apple-1.0.x-preview-spj
  build:
    template: freestyle:v4:publish
    steps:
      - ./gradlew -DscalaVersion=2.13 :iceberg-spark:iceberg-spark-3.3_2.13:build :iceberg-spark:iceberg-spark-extensions-3.3_2.13:build :iceberg-spark:iceberg-spark-runtime-3.3_2.13:build
      - home_dir=$(pwd)
      - ./gradlew -DscalaVersion=2.13 -Dmaven.repo.local=${home_dir}/local-repo :iceberg-spark:iceberg-spark-3.3_2.13:publishToMavenLocal :iceberg-spark:iceberg-spark-extensions-3.3_2.13:publishToMavenLocal :iceberg-spark:iceberg-spark-runtime-3.3_2.13:publishToMavenLocal
      - ci stage-lib --many-many-artifacts "./local-repo/**/*.jar"
      - ci stage-lib --many-many-artifacts "./local-repo/**/*.pom"
  package:
    freeform:
    - publish:
      - repo: m2:oss-patched
  finally:
    radar:
      annotate: true
  machine:
    baseImage: docker.apple.com/base-images/ubi8/java11-builder

- name: apple-1.0.x-preview-spj-scala-2.12-release
  branchName: apple-1.0.x-preview-spj-release
  build:
    template: buildozer:v4:publish
  package:
    release: true
    libraries:
    - publish:
      - repo: m2:oss-patched
  finally:
    radar:
      annotate: true
    tag:
      expression: ${CODE_VERSION}

- name: apple-1.0.x-preview-spj-scala-2.13-release
  branchName: apple-1.0.x-preview-spj-release
  build:
    template: freestyle:v4:publish
    steps:
      - ./gradlew -DscalaVersion=2.13 :iceberg-spark:iceberg-spark-3.3_2.13:build :iceberg-spark:iceberg-spark-extensions-3.3_2.13:build :iceberg-spark:iceberg-spark-runtime-3.3_2.13:build
      - home_dir=$(pwd)
      - ./gradlew -Priorelease -DscalaVersion=2.13 -Dmaven.repo.local=${home_dir}/local-repo :iceberg-spark:iceberg-spark-3.3_2.13:publishToMavenLocal :iceberg-spark:iceberg-spark-extensions-3.3_2.13:publishToMavenLocal :iceberg-spark:iceberg-spark-runtime-3.3_2.13:publishToMavenLocal
      - ci stage-lib --many-many-artifacts "./local-repo/**/*.jar"
      - ci stage-lib --many-many-artifacts "./local-repo/**/*.pom"
  package:
    release: true
    freeform:
      - publish:
          - repo: m2:oss-patched
  finally:
    radar:
      annotate: true
  machine:
    baseImage: docker.apple.com/base-images/ubi8/java11-builder