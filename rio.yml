schemaVersion: 2.0
timeout: 150

notify:
  pullRequestComment:
    postOnSuccess: false

machine:
  env:
    RUNTIME_JDK_VERSION: 17
    skipTest: false
    CODE_VERSION: $(./code_version.sh)

reports:
  checkstyle: true
  pmd: true
  findbugs: true
  junit: true

jenkins: &jenkins_config
  concurrentBuild: true
  maxConcurrentTotal: 8

pipelines:

  # prb builds
  - name: apple-1.9.1.x-preview-spark-prb
    branchName: apple-1.9.1.x-preview
    build:
      template: freestyle:v4:prb
      steps:
        - dev/apple/spark-build.sh
    machine:
      baseImage: docker.apple.com/pie/comet-builder-ubi8:latest
    jenkins: *jenkins_config

  - name: apple-1.9.1.x-preview-release-spark-prb
    branchName: apple-1.9.1.x-preview-release
    build:
      template: freestyle:v4:prb
      steps:
        - dev/apple/spark-build.sh
    machine:
      baseImage: docker.apple.com/pie/comet-builder-ubi8:latest
    jenkins: *jenkins_config

  - group: flink-prb-core
    machine:
      baseImage: docker.apple.com/pie/comet-builder-ubi8:latest
    build:
      template: freestyle:v4:prb
      steps:
        - TARGET=core dev/apple/flink-build.sh

  - group: flink-prb-1.18
    machine:
      baseImage: docker.apple.com/pie/comet-builder-ubi8:latest
    build:
      template: freestyle:v4:prb
      steps:
        - TARGET=flink FLINK_VERSION=1.18 dev/apple/flink-build.sh

  - group: flink-prb-1.19
    machine:
      baseImage: docker.apple.com/pie/comet-builder-ubi8:latest
    build:
      template: freestyle:v4:prb
      steps:
        - TARGET=flink FLINK_VERSION=1.19 dev/apple/flink-build.sh

  - group: flink-prb-1.20
    machine:
      baseImage: docker.apple.com/pie/comet-builder-ubi8:latest
    build:
      template: freestyle:v4:prb
      steps:
        - TARGET=flink FLINK_VERSION=1.20 dev/apple/flink-build.sh

  - group: flink-prb-2.1
    machine:
      baseImage: docker.apple.com/pie/comet-builder-ubi8:latest
    build:
      template: freestyle:v4:prb
      steps:
        - TARGET=flink FLINK_VERSION=2.1 dev/apple/flink-build.sh

  # publish pipelines
  - name: apple-1.9.1.x-preview-snapshot
    branchName: apple-1.9.1.x-preview
    build:
      template: freestyle:v4:publish
      steps:
        - dev/apple/spark-publish.sh
        - dev/apple/flink-publish.sh
    package:
      freeform:
        - publish:
            - repo: m2:oss-patched
    finally:
      radar:
        annotate: true
    machine:
      baseImage: docker.apple.com/pie/comet-builder-ubi8:latest
    jenkins: *jenkins_config

  - group: preview-release
    branchName: apple-1.9.1.x-preview-release
    build:
      template: freestyle:v4:publish
      steps:
        # Read version from version.txt (updated via manual PR)
        - export RELEASE_VERSION=$(cat version.txt)
        - export TAG="release-${RELEASE_VERSION}"
        # Create release tag
        - git tag -d "${TAG}" || true
        - git tag "${TAG}" -m "${TAG}"
        - dev/apple/spark-release.sh
        - RELEASE=true dev/apple/flink-publish.sh
        # Push the release tag
        - SSH_AUTH_SOCK=${SSH_AUTH_SOCK_DEPLOY_KEY} git push origin refs/tags/$TAG
    package:
      release: true
      freeform:
        - publish:
            - repo: m2:oss-patched
    finally:
      radar:
        annotate: true
    machine:
      baseImage: docker.apple.com/pie/comet-builder-ubi8:latest
    jenkins: *jenkins_config