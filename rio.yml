schemaVersion: 2.0
timeout: 120

notify:
  pullRequestComment:
    postOnSuccess: false

machine:
  env: &base_env
    RUNTIME_JDK_VERSION: 11
    skipTest: false
    CODE_VERSION: $(./code_version.sh)

reports:
  checkstyle: true
  pmd: true
  findbugs: true
  junit: true

pipelines:

# prb builds
- name: apple-1.0.x-preview-scala-2.12-prb
  branchName: apple-1.0.x-preview
  build:
    template: buildozer:v4:prb
  machine:
    env:
      <<: *base_env
      ORG_GRADLE_PROJECT_scalaVersion: 2.12

- name: apple-1.0.x-preview-scala-2.13-prb
  branchName: apple-1.0.x-preview
  build:
    template: freestyle:v4:publish
    steps:
      - ./gradlew -DscalaVersion=2.13 :iceberg-spark:iceberg-spark-3.3_2.13:build :iceberg-spark:iceberg-spark-extensions-3.3_2.13:build :iceberg-spark:iceberg-spark-runtime-3.3_2.13:build
  machine:
    baseImage: docker.apple.com/base-images/ubi8/java11-builder

- branchName: apple-1.0.x-preview-release
  build:
    template: buildozer:v4:prb

# publish pipelines
- name: apple-1.0.x-preview-scala-2.12-snapshot
  branchName: apple-1.0.x-preview
  build:
    template: buildozer:v4:publish
  package:
    libraries:
    - publish:
      - repo: m2:oss-patched
  finally:
    radar:
      annotate: true

- name: apple-1.0.x-preview-scala-2.13-snapshot
  branchName: apple-1.0.x-preview
  build:
    template: freestyle:v4:publish
    steps:
      - ./gradlew -DscalaVersion=2.13 :iceberg-spark:iceberg-spark-3.3_2.13:build :iceberg-spark:iceberg-spark-extensions-3.3_2.13:build :iceberg-spark:iceberg-spark-runtime-3.3_2.13:build
      - my_version="$(cat version.txt)-SNAPSHOT"
      - ci stage-lib --many-many-artifacts "./spark/v3.3/spark-runtime/.out/libs/*.jar,org/apache/iceberg/iceberg-spark-runtime-3.3_2.13/${my_version}/"
      - ci stage-lib --many-many-artifacts "./spark/v3.3/spark-extensions/.out/libs/*.jar,org/apache/iceberg/iceberg-spark-extensions-3.3_2.13/${my_version}/"
      - ci stage-lib --many-many-artifacts "./spark/v3.3/spark/.out/libs/*.jar,org/apache/iceberg/iceberg-spark-3.3_2.13/${my_version}/"
  package:
    freeform:
    - publish:
      - repo: m2:oss-patched
  finally:
    radar:
      annotate: true
  machine:
    baseImage: docker.apple.com/base-images/ubi8/java11-builder

- branchName: apple-1.0.x-preview-scala-2.12-release
  build:
    template: buildozer:v4:publish
  package:
    release: true
    libraries:
    - publish:
      - repo: m2:oss-patched
  finally:
    radar:
      annotate: true
    tag:
      expression: ${CODE_VERSION}

- name: apple-1.0.x-preview-scala-2.13-release
  branchName: apple-1.0.x-preview
  build:
    template: freestyle:v4:publish
    steps:
      - ./gradlew -DscalaVersion=2.13 :iceberg-spark:iceberg-spark-3.3_2.13:build :iceberg-spark:iceberg-spark-extensions-3.3_2.13:build :iceberg-spark:iceberg-spark-runtime-3.3_2.13:build
      - ./dev/remove-snapshot-suffix.sh
      - my_version="$(cat version.txt)"
      - ci stage-lib --many-many-artifacts "./spark/v3.3/spark-runtime/.out/libs/*.jar,org/apache/iceberg/iceberg-spark-runtime-3.3_2.13/${my_version}/"
      - ci stage-lib --many-many-artifacts "./spark/v3.3/spark-extensions/.out/libs/*.jar,org/apache/iceberg/iceberg-spark-extensions-3.3_2.13/${my_version}/"
      - ci stage-lib --many-many-artifacts "./spark/v3.3/spark/.out/libs/*.jar,org/apache/iceberg/iceberg-spark-3.3_2.13/${my_version}/"
  package:
    release: true
    freeform:
      - publish:
          - repo: m2:oss-patched
  finally:
    radar:
      annotate: true
  machine:
    baseImage: docker.apple.com/base-images/ubi8/java11-builder