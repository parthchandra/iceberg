def sparkProjects = [
    project(':iceberg-spark:iceberg-spark-3.2'),
    project(":iceberg-spark:iceberg-spark-extensions-3.2"),
    project(':iceberg-spark:iceberg-spark-runtime-3.2')
]

configure(sparkProjects) {
  project.ext {
    sparkVersion = '3.2.0.44-apple-SNAPSHOT'
  }

  configurations {
    all {
      resolutionStrategy {
        force 'com.fasterxml.jackson.module:jackson-module-scala_2.12:2.12.3'
        force 'com.fasterxml.jackson.module:jackson-module-paranamer:2.12.3'
        // Required to avoid us using the parquet version provided by spark in tests
        // can be removed when we upgrade parquet to match spark
        force 'org.apache.parquet:parquet-avro:1.12.0.22-apple'
        force 'org.apache.parquet:parquet-column:1.12.0.22-apple'
        force 'org.apache.parquet:parquet-common:1.12.0.22-apple'
        force 'org.apache.parquet:parquet-encoding:1.12.0.22-apple'
        force 'org.apache.parquet:parquet-format-structures:1.12.0.22-apple'
        force 'org.apache.parquet:parquet-hadoop:1.12.0.22-apple'
        force 'org.apache.parquet:parquet-jackson:1.12.0.22-apple'
        // Forced to use the Hive metastore version which has `setCurrentCatalog` API.
        // We can remove this once Hive version is upgraded in Spark.
        force 'org.apache.hive:hive-metastore:2.3.9.4-apple'
      }
    }
  }
}

project(':iceberg-spark:iceberg-spark-3.2') {
  apply plugin: 'scala'
  apply plugin: 'com.github.alisiikh.scalastyle'

  sourceSets {
    main {
      scala.srcDirs = ['src/main/scala', 'src/main/java']
      java.srcDirs = []
    }
  }

  dependencies {
    implementation project(path: ':iceberg-bundled-guava', configuration: 'shadow')
    api project(':iceberg-api')
    implementation project(':iceberg-common')
    implementation project(':iceberg-core')
    implementation project(':iceberg-data')
    implementation project(':iceberg-orc')
    implementation project(':iceberg-parquet')
    implementation project(':iceberg-arrow')
    implementation project(':iceberg-hive-metastore')

    compileOnly "com.google.errorprone:error_prone_annotations"
    compileOnly "org.apache.avro:avro"
    compileOnly("org.apache.spark:spark-hive_2.12:${sparkVersion}") {
      exclude group: 'org.apache.avro', module: 'avro'
      exclude group: 'org.apache.arrow'
      // to make sure netty libs only come from project(':iceberg-arrow')
      exclude group: 'io.netty', module: 'netty-buffer'
      exclude group: 'io.netty', module: 'netty-common'
      exclude group: 'org.roaringbitmap'
      // use the parquet lib from boson
      exclude group: 'org.apache.parquet'
    }

    implementation("com.apple.pie.boson:boson-iceberg-spark3.2_2.12") {
      exclude group: 'org.apache.arrow', module: 'arrow-vector'
      exclude group: 'org.apache.spark', module: 'spark-sql_2.12'
      exclude group: 'org.apache.spark', module: 'spark-catalyst_2.12'
      exclude group: 'org.apache.spark', module: 'spark-core_2.12'
      exclude group: 'org.apache.spark', module: 'spark-hadoop-cloud_2.12'
      exclude group: 'org.apache.iceberg'
    }

    implementation("org.apache.orc:orc-core::nohive") {
      exclude group: 'org.apache.hadoop'
      exclude group: 'commons-lang'
      // These artifacts are shaded and included in the orc-core fat jar
      exclude group: 'com.google.protobuf', module: 'protobuf-java'
      exclude group: 'org.apache.hive', module: 'hive-storage-api'
    }

    implementation("org.apache.arrow:arrow-vector") {
      exclude group: 'io.netty', module: 'netty-buffer'
      exclude group: 'io.netty', module: 'netty-common'
      exclude group: 'com.google.code.findbugs', module: 'jsr305'
    }

    testImplementation("org.apache.hadoop:hadoop-minicluster") {
      exclude group: 'org.apache.avro', module: 'avro'
      // to make sure netty libs only come from project(':iceberg-arrow')
      exclude group: 'io.netty', module: 'netty-buffer'
      exclude group: 'io.netty', module: 'netty-common'
    }
    testImplementation project(path: ':iceberg-hive-metastore')
    testImplementation project(path: ':iceberg-hive-metastore', configuration: 'testArtifacts')
    testImplementation project(path: ':iceberg-api', configuration: 'testArtifacts')
    testImplementation project(path: ':iceberg-core', configuration: 'testArtifacts')
    testImplementation project(path: ':iceberg-data', configuration: 'testArtifacts')
    testImplementation "org.xerial:sqlite-jdbc"
  }

  tasks.withType(Test) {
    // For vectorized reads
    // Allow unsafe memory access to avoid the costly check arrow does to check if index is within bounds
    systemProperty("arrow.enable_unsafe_memory_access", "true")
    // Disable expensive null check for every get(index) call.
    // Iceberg manages nullability checks itself instead of relying on arrow.
    systemProperty("arrow.enable_null_check_for_get", "false")

    // Vectorized reads need more memory
    maxHeapSize '2560m'
  }
}

project(":iceberg-spark:iceberg-spark-extensions-3.2") {
  apply plugin: 'java-library'
  apply plugin: 'scala'
  apply plugin: 'com.github.alisiikh.scalastyle'
  apply plugin: 'antlr'

  configurations {
    /*
     The Gradle Antlr plugin erroneously adds both antlr-build and runtime dependencies to the runtime path. This
     bug https://github.com/gradle/gradle/issues/820 exists because older versions of Antlr do not have separate
     runtime and implementation dependencies and they do not want to break backwards compatibility. So to only end up with
     the runtime dependency on the runtime classpath we remove the dependencies added by the plugin here. Then add
     the runtime dependency back to only the runtime configuration manually.
    */
    implementation {
      extendsFrom = extendsFrom.findAll { it != configurations.antlr }
    }
  }

  dependencies {
    compileOnly "org.scala-lang:scala-library"
    compileOnly project(path: ':iceberg-bundled-guava', configuration: 'shadow')
    compileOnly project(':iceberg-api')
    compileOnly project(':iceberg-core')
    compileOnly project(':iceberg-common')
    compileOnly project(':iceberg-spark:iceberg-spark-3.2')
    compileOnly("org.apache.spark:spark-hive_2.12:${sparkVersion}") {
      exclude group: 'org.apache.avro', module: 'avro'
      exclude group: 'org.apache.arrow'
      // to make sure netty libs only come from project(':iceberg-arrow')
      exclude group: 'io.netty', module: 'netty-buffer'
      exclude group: 'io.netty', module: 'netty-common'
      exclude group: 'org.roaringbitmap'
      // use the parquet lib from boson
      exclude group: 'org.apache.parquet'
    }

    testImplementation project(path: ':iceberg-hive-metastore')
    testImplementation project(path: ':iceberg-hive-metastore', configuration: 'testArtifacts')

    testImplementation project(path: ':iceberg-api', configuration: 'testArtifacts')
    testImplementation project(path: ':iceberg-hive-metastore', configuration: 'testArtifacts')
    testImplementation project(path: ':iceberg-spark:iceberg-spark-3.2', configuration: 'testArtifacts')

    testImplementation "org.apache.avro:avro"

    // Required because we remove antlr plugin dependencies from the compile configuration, see note above
    // We shade this in Spark3 Runtime to avoid issues with Spark's Antlr Runtime
    runtimeOnly "org.antlr:antlr4-runtime:4.7.1"
    antlr "org.antlr:antlr4:4.7.1"
  }

  generateGrammarSource {
    maxHeapSize = "64m"
    arguments += ['-visitor', '-package', 'org.apache.spark.sql.catalyst.parser.extensions']
  }
}

project(':iceberg-spark:iceberg-spark-runtime-3.2') {
  apply plugin: 'com.github.johnrengelman.shadow'

  tasks.jar.dependsOn tasks.shadowJar

  sourceSets {
    integration {
      java.srcDir "$projectDir/src/integration/java"
      resources.srcDir "$projectDir/src/integration/resources"
    }
  }

  configurations {
    implementation {
      // Including two versions of a JNI-lib can cause many issues and we can't shade this.
      exclude group: 'com.github.luben' // libzstd
      exclude group: 'org.apache.spark'
      // included in Spark
      exclude group: 'org.slf4j'
      exclude group: 'org.apache.commons'
      exclude group: 'commons-pool'
      exclude group: 'commons-codec'
      exclude group: 'org.xerial.snappy'
      exclude group: 'javax.xml.bind'
      exclude group: 'javax.annotation'
      exclude group: 'com.github.luben'
      exclude group: 'com.ibm.icu'
      exclude group: 'org.glassfish'
      exclude group: 'org.abego.treelayout'
      exclude group: 'org.antlr', module: 'ST4'
      exclude group: 'org.antlr', module: 'antlr4'
    }
  }

  dependencies {
    api project(':iceberg-api')
    implementation project(':iceberg-spark:iceberg-spark-3.2')
    implementation project(':iceberg-spark:iceberg-spark-extensions-3.2')
    implementation project(':iceberg-aws')
    implementation(project(':iceberg-aliyun')) {
      exclude group: 'edu.umd.cs.findbugs', module: 'findbugs'
      exclude group: 'org.apache.httpcomponents', module: 'httpclient'
      exclude group: 'commons-logging', module: 'commons-logging'
    }
    implementation project(':iceberg-hive-metastore')
    implementation(project(':iceberg-nessie')) {
      exclude group: 'com.google.code.findbugs', module: 'jsr305'
    }

    // Add for Aws Apple Connect
    compileOnly (group: "com.apple.pie.spark", name: "awsappleconnect-spark-utils-shaded", classifier: "shaded") {
      transitive = false
    }

    integrationImplementation "org.apache.spark:spark-hive_2.12:${sparkVersion}"
    integrationImplementation 'org.junit.vintage:junit-vintage-engine'
    integrationImplementation 'org.slf4j:slf4j-simple'
    integrationImplementation project(path: ':iceberg-api', configuration: 'testArtifacts')
    integrationImplementation project(path: ':iceberg-hive-metastore', configuration: 'testArtifacts')
    integrationImplementation project(path: ':iceberg-spark:iceberg-spark-3.2', configuration: 'testArtifacts')
    integrationImplementation project(path: ':iceberg-spark:iceberg-spark-extensions-3.2', configuration: 'testArtifacts')
    // Not allowed on our classpath, only the runtime jar is allowed
    integrationCompileOnly project(':iceberg-spark:iceberg-spark-extensions-3.2')
    integrationCompileOnly project(':iceberg-spark:iceberg-spark-3.2')
    integrationCompileOnly project(':iceberg-api')
  }

  shadowJar {
    configurations = [project.configurations.runtimeClasspath]

    zip64 true

    // include the LICENSE and NOTICE files for the shaded Jar
    from(projectDir) {
      include 'LICENSE'
      include 'NOTICE'
    }

    // Relocate dependencies to avoid conflicts
    relocate 'com.google', 'org.apache.iceberg.shaded.com.google'
    relocate 'com.fasterxml', 'org.apache.iceberg.shaded.com.fasterxml'
    relocate 'com.github.benmanes', 'org.apache.iceberg.shaded.com.github.benmanes'
    relocate 'org.checkerframework', 'org.apache.iceberg.shaded.org.checkerframework'
    relocate 'org.apache.avro', 'org.apache.iceberg.shaded.org.apache.avro'
    relocate 'avro.shaded', 'org.apache.iceberg.shaded.org.apache.avro.shaded'
    relocate 'com.thoughtworks.paranamer', 'org.apache.iceberg.shaded.com.thoughtworks.paranamer'
    relocate 'org.apache.parquet', 'org.apache.iceberg.shaded.org.apache.parquet'
    relocate 'shaded.parquet', 'org.apache.iceberg.shaded.org.apache.parquet.shaded'
    relocate 'org.apache.orc', 'org.apache.iceberg.shaded.org.apache.orc'
    relocate 'io.airlift', 'org.apache.iceberg.shaded.io.airlift'
    // relocate Arrow and related deps to shade Iceberg specific version
    relocate 'io.netty', 'org.apache.iceberg.shaded.io.netty'
    relocate('org.apache.arrow', 'org.apache.iceberg.shaded.org.apache.arrow') {
      // Boson uses `org.apache.arrow.c` module, but we shouldn't relocate `JniWrapper` since it
      // contains native JNI methods
      exclude 'org.apache.arrow.c.jni.JniWrapper'
    }
    relocate 'com.carrotsearch', 'org.apache.iceberg.shaded.com.carrotsearch'
    relocate 'org.threeten.extra', 'org.apache.iceberg.shaded.org.threeten.extra'
    // relocate Antlr runtime and related deps to shade Iceberg specific version
    relocate 'org.antlr.v4', 'org.apache.iceberg.shaded.org.antlr.v4'
    relocate 'org.roaringbitmap', 'org.apache.iceberg.shaded.org.roaringbitmap'
    // We need to relocate Boson since both Iceberg and Spark depends on `boson-common` and thus there'll be
    // two copies for every class in `boson-common`. Since Iceberg shades Parquet, this will cause conflicts
    // at class loading time.
    relocate('com.apple.boson', 'org.apache.iceberg.shaded.com.apple.boson') {
      exclude 'com.apple.boson.NativeBase'
      exclude 'com.apple.boson.Native'
      exclude 'com.apple.boson.parquet.Native'
    }
    relocate 'org.apache.spark.sql.boson', 'org.apache.iceberg.shaded.org.apache.spark.sql.boson'

    classifier null
  }

  task integrationTest(type: Test) {
    description = "Test Spark3 Runtime Jar against Spark 3.2"
    group = "verification"
    testClassesDirs = sourceSets.integration.output.classesDirs
    classpath = sourceSets.integration.runtimeClasspath + files(shadowJar.archiveFile.get().asFile.path)
    inputs.file(shadowJar.archiveFile.get().asFile.path)
  }
  integrationTest.dependsOn shadowJar

  jar {
    enabled = false
  }
}
